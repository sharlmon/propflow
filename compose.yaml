services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propflow}
      POSTGRES_USER: ${POSTGRES_USER:-propflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propflow_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - propflow-db:/var/lib/postgresql/data
      - ./api/migrations/000001_initial.up.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: propflow_test
      POSTGRES_USER: propflow
      POSTGRES_PASSWORD: propflow_test_only
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propflow -d propflow_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://propflow:propflow_dev_only@db:5432/propflow?sslmode=disable}
      APP_ENV: ${APP_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: web
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  propflow-db:
