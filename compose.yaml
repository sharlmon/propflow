services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propflow}
      POSTGRES_USER: ${POSTGRES_USER:-propflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propflow_dev_only}
    ports:
      - '5432:5432'
    volumes:
      - propflow-db:/var/lib/postgresql/data
      - ./services/api/migrations/000001_initial.up.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./services/api/migrations/000002_seed.up.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
      - ./services/api/migrations/000003_ecosystem_foundation.up.sql:/docker-entrypoint-initdb.d/003-ecosystem.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  test-db:
    image: postgres:17-alpine
    profiles: ['test']
    environment:
      POSTGRES_DB: propflow_test
      POSTGRES_USER: propflow
      POSTGRES_PASSWORD: propflow_test_only
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U propflow -d propflow_test']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-propflow_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-propflow_local_only_change_me}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - propflow-media:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/propflow-media &&
        mc anonymous set none local/propflow-media
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-propflow_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-propflow_local_only_change_me}

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://propflow:propflow_dev_only@db:5432/propflow?sslmode=disable}
      APP_ENV: ${APP_ENV:-development}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3000,http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HTTP_ADDR: :8080
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-propflow-media}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-propflow_local}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-propflow_local_only_change_me}
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/app/healthcheck']
      interval: 10s
      timeout: 3s
      retries: 10

  platform-web:
    build:
      context: .
      dockerfile: apps/platform-web/Dockerfile
    ports:
      - '3000:80'
    depends_on:
      api:
        condition: service_healthy

  jengabora-web:
    build:
      context: .
      dockerfile: apps/jengabora-web/Dockerfile
    ports:
      - '3001:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  propflow-db:
  propflow-media:
