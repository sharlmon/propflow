name: MVP quality gates

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.x', cache-dependency-path: api/go.sum }
      - run: go mod download
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  database-and-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: propflow, POSTGRES_PASSWORD: propflow_test_only, POSTGRES_DB: propflow_ci_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U propflow -d propflow_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://propflow:propflow_test_only@localhost:5432/propflow_ci_test?sslmode=disable
      PGPASSWORD: propflow_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.x', cache-dependency-path: api/go.sum }
      - run: psql -h localhost -U propflow -d propflow_ci_test -v ON_ERROR_STOP=1 -f api/migrations/000001_initial.up.sql
      - run: psql -h localhost -U propflow -d propflow_ci_test -v ON_ERROR_STOP=1 -f api/migrations/000002_seed.up.sql
      - run: test "$(psql -h localhost -U propflow -d propflow_ci_test -Atc "select count(*) from listings where status='published'")" -ge 6
      - run: npm ci
        working-directory: web
      - run: npm run contract:check
        working-directory: web
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate -f sqlc.yaml
        working-directory: api
      - run: git diff --exit-code -- api/sqlc

  golden-path:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: propflow, POSTGRES_PASSWORD: propflow_test_only, POSTGRES_DB: propflow_e2e_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U propflow -d propflow_e2e_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://propflow:propflow_test_only@localhost:5432/propflow_e2e_test?sslmode=disable
      PGPASSWORD: propflow_test_only
      APP_ORIGIN: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.x', cache-dependency-path: api/go.sum }
      - run: psql -h localhost -U propflow -d propflow_e2e_test -v ON_ERROR_STOP=1 -f api/migrations/000001_initial.up.sql
      - run: psql -h localhost -U propflow -d propflow_e2e_test -v ON_ERROR_STOP=1 -f api/migrations/000002_seed.up.sql
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/playwright-report, retention-days: 7 }

  security-and-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25.x', cache-dependency-path: api/go.sum }
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: api
      - run: docker build -f api/Dockerfile -t propflow-api:ci .
      - run: docker build -f web/Dockerfile -t propflow-web:ci web
      - name: Start the complete Compose demo topology
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Smoke web and API health
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/healthz
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/readyz
          curl --fail --retry 5 --retry-delay 2 http://localhost:5173/
      - name: Show Compose logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Compose demo topology
        if: always()
        run: docker compose down -v
