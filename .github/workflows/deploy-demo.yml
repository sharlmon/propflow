name: Build demo release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-artifacts:
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t propflow-api:${{ github.sha }} .
      - run: docker build -f apps/platform-web/Dockerfile -t propflow-platform-web:${{ github.sha }} .
      - run: docker build -f apps/jengabora-web/Dockerfile -t propflow-jengabora-web:${{ github.sha }} .
      - name: Deployment boundary
        run: |
          echo "Images passed their production builds."
          echo "Attach a hosting provider only after DEMO_DATABASE_URL and health-check rollback are configured."
